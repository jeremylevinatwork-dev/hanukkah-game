name: Rename game file to index.html
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename and remove workflow
        run: |
          test -f hanukkah-game.html
          git mv hanukkah-game.html index.html
          rm -rf .github
          git config user.name "jeremylevinatwork-dev"
          git config user.email "jeremylevinatwork-dev@users.noreply.github.com"
          git add -A
          git commit -m "Rename hanukkah-game.html to index.html"
          git push
