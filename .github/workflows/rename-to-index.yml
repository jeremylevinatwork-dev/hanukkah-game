name: Rename hanukkah-game.html to index.html

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-to-index.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv hanukkah-game.html index.html
          rm .github/workflows/rename-to-index.yml
          git add -A
          git commit -m "Rename hanukkah-game.html to index.html"
          git push
